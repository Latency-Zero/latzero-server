[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latzero-server"
version = "0.1.0"
description = "Local TCP server for LatZero pools and app routing."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "BRAHMAI", email = "hello@brahmai.in"}
]
dependencies = ["websockets>=12.0"]

[project.optional-dependencies]
tui = ["Pillow>=9.0", "prompt_toolkit>=3.0"]

[project.scripts]
latzero-server = "latzero_server.cli:main"

[tool.setuptools.packages.find]
include = ["latzero_server*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
